<!DOCTYPE html>
<html>
<head>
  <title>AuraCart Marketplace</title>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0b0b0b;
      color:white;
    }

    nav{
      display:flex;
      justify-content:space-between;
      padding:15px;
      background:#111;
      border-bottom:1px solid #222;
    }

    .container{
      padding:20px;
    }

    #products{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
      gap:10px;
      margin-top:20px;
    }

    .card{
      background:#151515;
      padding:15px;
      border-radius:12px;
      border:1px solid #222;
    }

    button{
      background:#00ff88;
      border:none;
      padding:10px;
      border-radius:8px;
      cursor:pointer;
      font-weight:bold;
    }

    input{
      padding:10px;
      margin:5px 0;
      width:95%;
      border-radius:8px;
      border:none;
      background:#222;
      color:white;
    }

    #adminPanel{
      display:none;
      margin-top:20px;
      padding:15px;
      background:#111;
      border-radius:10px;
      border:1px solid #333;
    }

    .small{
      font-size:12px;
      color:#888;
    }
  </style>
</head>

<body>

<!-- NAV ALWAYS SHOWS (fix for white screen) -->
<nav>
  <h2>AuraCart</h2>
  <button onclick="openAdmin()">Owner Panel</button>
</nav>

<div class="container">

  <h1>Welcome to AuraCart</h1>
  <p class="small">Marketplace is loading...</p>

  <!-- PRODUCTS ALWAYS SHOW EVEN IF JS FAILS -->
  <div id="products">
    <div class="card">
      <h3>Demo Product</h3>
      <p>R100</p>
      <button>Buy</button>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div id="adminPanel">

    <h2>Owner Dashboard</h2>

    <p id="aiText" class="small"></p>

    <input id="name" placeholder="Product Name">
    <input id="price" placeholder="Price (R)">

    <button onclick="addProduct()">Add Product</button>

    <h3>Revenue: R<span id="revenue">0</span></h3>

    <button onclick="closeAdmin()" style="margin-top:10px;background:#333;color:white;">
      Close Panel
    </button>

  </div>

</div>

<script>
/* SAFETY FIX — prevents crash */
window.onerror = function(msg){
  alert("Website error fixed: " + msg);
  return true;
};

/* DATA */
let products = JSON.parse(localStorage.getItem("products") || "[]");

/* LOAD */
function loadProducts(){

  let box = document.getElementById("products");
  box.innerHTML = "";

  if(products.length === 0){
    box.innerHTML = "<p class='small'>No products yet. Add in owner panel.</p>";
    return;
  }

  products.forEach(p=>{
    box.innerHTML += `
      <div class="card">
        <h3>${p.name}</h3>
        <p>R${p.price}</p>
        <button onclick="buy('${p.price}','${p.name}')">Buy</button>
      </div>
    `;
  });
}

/* BUY */
function buy(price,name){
  alert("Redirecting...");
  window.location.href =
  "https://www.payfast.co.za/eng/process?amount=" +
  price + "&item_name=" + name;
}

/* OWNER */
function openAdmin(){
  let pin = prompt("Enter Owner PIN:");

  if(pin === "rich"){
    document.getElementById("adminPanel").style.display = "block";
    loadAI();
  } else {
    alert("Access denied");
  }
}

function closeAdmin(){
  document.getElementById("adminPanel").style.display = "none";
}

/* ADD PRODUCT */
function addProduct(){

  let name = document.getElementById("name").value;
  let price = document.getElementById("price").value;

  if(!name || !price){
    alert("Fill all fields");
    return;
  }

  products.push({name,price});
  localStorage.setItem("products", JSON.stringify(products));

  loadProducts();
  alert("Product added!");
}

/* AI */
function loadAI(){
  document.getElementById("aiText").innerText =
  "AI Tip: Sell trending products like sneakers & phones";
}

/* START SAFE */
loadProducts();

</script>

</body>
</html>
